# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/
#
# Run with: cargo deny check
# Or via xtask: cargo xtask deny

[graph]
# Targets to check (all common platforms)
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

# Exclude dev-dependencies from checks (they don't ship with your code)
exclude-dev = true

[advisories]
version = 2

# Security vulnerability database
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/rustsec/advisory-db"]

# Deny yanked crates
yanked = "deny"

# Ignore specific advisories (add IDs here if you must)
ignore = []

[licenses]
version = 2

# Confidence threshold for license detection
confidence-threshold = 0.93

# List of allowed licenses
# All licenses not in this list are denied by default in version 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "ISC",
    "CC0-1.0",
    "Unlicense",
    "Zlib",
    "MPL-2.0",         # Weak copyleft, file-level only
    "Unicode-3.0",     # Required by unicode crates
    "BUSL-1.1",        # Required by surrealdb (Business Source License)
]

# Skip checking these crates (e.g., private crates with custom licenses)
exceptions = []

# Clarify licenses for crates with unclear license files
[[licenses.clarify]]
name = "ring"
expression = "MIT AND ISC AND OpenSSL"
license-files = [{ path = "LICENSE", hash = 0xbd0eed23 }]

[bans]
# Lint level for multiple versions of the same crate
multiple-versions = "warn"

# Lint level for crates that wrap a specific version of another crate
wildcards = "deny"

# Highlight which crate pulls in duplicates
highlight = "all"

# Deny specific crates entirely
deny = [
    # Example: { name = "openssl", wrappers = ["openssl-sys"] },
]

# Skip checking these crates for duplicates
skip = []

# Skip checking entire dependency trees
skip-tree = []

# [bans.build] section removed - build scripts are allowed by default
# The ast-grep dependencies have build scripts for tree-sitter parsers

[sources]
# Only allow crates from crates.io
unknown-registry = "deny"
unknown-git = "deny"

# Allow specific git sources (empty by default)
allow-git = []

# Allow specific registries
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
